[project]
name = "lung-clam"
version = "0.1.0"
description = "Weakly supervised Normal / LUAD / LUSC classification of lung whole-slide images with CLAM"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = "==3.10.*"
dependencies = [
    # deep learning (CLAM pins timm 0.9.8, but that cannot import huggingface-hub 2.x;
    # timm 1.x keeps the same ResNet50 weights and is required for UNI2-h)
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0.15",
    "transformers>=4.44",          # Phikon / Phikon-v2 encoders
    "huggingface-hub>=0.24",
    "future>=1.0",                 # needed by smooth-topk
    "topk @ git+https://github.com/oval-group/smooth-topk.git@12c1645f187e2fa0c05f47bf1fe48864d4bd2707",
    # whole-slide images
    "openslide-python>=1.4",
    "openslide-bin>=4.0",          # bundled OpenSlide 4.x binary (reads SVS + DICOM WSI)
    "opencv-python-headless>=4.9",
    "h5py>=3.10",
    "pillow>=10",
    # data access
    "idc-index>=0.11",
    # science stack
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tabulate>=0.9",               # DataFrame.to_markdown for results tables
    "tensorboardx>=2.6",
]

[dependency-groups]
dev = ["ipykernel>=6.29", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
